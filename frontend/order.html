<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1280" />
    <title>Статус заказа</title>
  </head>
  <body>
    <div class="canvas">
      <header class="header">
        <div class="header__inner">
          <a class="catalog-button" href="./index.html">
            <span data-icon="catalog"></span>
            <span>Витрина</span>
          </a>
        </div>
      </header>

      <main class="container order-page" data-order-page>
        <!-- Обратный отсчёт брони, плашка цены и статус подставляются
             из order.ts (см. renderOrder) — узел таймера [data-reservation]

             заказа, чтобы не расходиться с ней при каждой перерисовке. -->
        <div class="order-card">
          <p class="order-note">Загружаем заказ...</p>
        </div>
      </main>
    </div>

    <script type="module" src="/src/order.ts"></script>
