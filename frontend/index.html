<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1280" />
    <title>Магазин цифровых товаров</title>
    <meta name="description" content="Ключи, пополнения, подписки и подарочные карты для геймеров." />
    <link rel="preload" as="image" href="./assets/banner-1@2x.webp" />
  </head>
  <body>
    <div class="canvas">
      <header class="header">
        <div class="header__inner">
          <button class="catalog-button" type="button" data-catalog-button aria-expanded="false" aria-controls="catalog-menu">
            <span data-icon="grid"></span>
            <span>Каталог</span>
          </button>

          <div class="search" data-search>
            <div class="search__field">
              <input class="search__input" type="search" placeholder="Игра, приложение или услуга..." aria-label="Поиск" />
              <button class="search__favorite" type="button" aria-label="Избранное"><span data-icon="heart"></span></button>
            </div>
            <button class="search__submit" type="button" aria-label="Найти"><span data-icon="search"></span></button>
          </div>

          <button class="account" type="button" aria-label="Профиль"><span data-icon="profile"></span></button>
        </div>

        <div class="catalog-menu" id="catalog-menu" data-catalog-menu></div>
      </header>

      <main class="container">
        <section class="banner" data-banner aria-label="Акции и подборки"></section>

        <section class="services" aria-label="Сервисы и пополнение">
          <div class="services__icons" data-services></div>
          <div class="services__divider"></div>

          <div class="steam">
            <div class="steam__app">
              <span class="steam__logo">
                <picture>
                  <source srcset="./assets/icons/steam.webp 1x, ./assets/icons/steam@2x.webp 2x" type="image/webp" />
                  <img src="./assets/icons/steam.webp" alt="" width="76" height="76" />
                </picture>
              </span>
              <div>
                <div class="steam__title">Пополнение Steam <span class="steam__bonus">5%</span></div>
                <button class="steam__promo" type="button">Ввести промокод <span data-icon="chevron-down"></span></button>
              </div>
            </div>

            <label class="steam__login">
              <span data-icon="profile"></span>
              <input type="text" placeholder="Логин Steam" aria-label="Логин Steam" />
              <button class="steam__hint" type="button" aria-label="Где найти логин">i</button>
            </label>

            <div class="steam__amount">
              <span class="steam__amount-label">
                <span class="steam__amount-icon" data-icon="ruble"></span>
                <span class="steam__amount-text">
                  <span class="steam__amount-caption">Сумма</span>
                  <span class="steam__amount-value">500₽</span>
                </span>
              </span>

              <!-- Рассинхрон валют (сумма в ₽, кнопка в $) взят из макета: ТЗ просит его не исправлять. -->
              <div class="currency" data-currency-switcher role="group" aria-label="Валюта">
                <button class="currency__button" type="button" data-currency="USD" aria-pressed="true">$</button>
                <button class="currency__button" type="button" data-currency="KZT" aria-pressed="false">₸</button>
                <button class="currency__button" type="button" data-currency="RUB" aria-pressed="false">₽</button>
              </div>
            </div>

            <button class="steam__pay" type="button">Оплатить 500$</button>
          </div>
        </section>

        <section class="section" aria-label="Популярные товары">
          <div class="section__head">
            <h2 class="section__title">Популярные товары</h2>
            <div class="section__tabs" data-tabs></div>
          </div>
          <div class="cards" data-cards></div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
