<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1280" />
    <title>Магазин цифровых товаров</title>
    <meta name="description" content="Ключи, пополнения, подписки и подарочные карты для геймеров." />
    <link
      rel="preload"
      as="image"
      href="./assets/banner-1.webp"
      imagesrcset="./assets/banner-1.webp 1x, ./assets/banner-1@2x.webp 2x"
      type="image/webp"
    />
  </head>
  <body>
    <div class="canvas">
      <h1 class="visually-hidden">Магазин цифровых товаров: ключи, пополнения, подписки и подарочные карты</h1>

      <header class="header">
        <div class="header__inner">
          <button
            class="catalog-button"
            type="button"
            data-catalog-button
            aria-expanded="false"
            aria-controls="catalog-menu"
          >
            <span data-icon="catalog"></span>
            <span>Каталог</span>
          </button>

          <div class="search">
            <div class="search__field">
              <input
                class="search__input"
                type="search"
                placeholder="Игра, приложение или услуга..."
                aria-label="Поиск"
              />
            </div>
            <button class="search__favorite" type="button" aria-label="Избранное">
              <span data-icon="favorite"></span>
            </button>
            <button class="search__submit" type="button" aria-label="Найти">
              <span data-icon="search"></span>
            </button>
          </div>

          <button class="account" type="button" aria-label="Профиль">
            <span class="account__icon">
              <span data-icon="profile-body"></span>
              <span data-icon="profile-head"></span>
            </span>
          </button>
        </div>

        <div class="catalog-menu" id="catalog-menu" data-catalog-menu></div>
      </header>

      <main class="container">
        <section class="banner" data-banner aria-label="Акции и подборки"></section>

        <section class="services" aria-label="Сервисы и пополнение">
          <div class="services__icons" data-services></div>
          <div class="services__divider"></div>

          <div class="steam" data-steam>
            <div class="steam__app">
              <span class="service__wrapper">
                <span class="service__tile" style="--service-border: #1482b3">
                  <picture>
                    <source srcset="./assets/icons/steam.webp 1x, ./assets/icons/steam@2x.webp 2x" type="image/webp" />
                    <img src="./assets/icons/steam.webp" alt="" width="68" height="68" />
                  </picture>
                </span>
              </span>

              <div class="steam__info">
                <div class="steam__title-row">
                  <span class="steam__title">Пополнение Steam</span>
                  <span class="steam__bonus">5%</span>
                </div>
                <button
                  class="steam__promo"
                  type="button"
                  data-steam-promo-toggle
                  aria-expanded="false"
                  aria-controls="steam-promo"
                >
                  Ввести промокод
                  <span data-icon="chevron"></span>
                </button>

                <!-- Этап 4: промокод. Поле раскрывается кнопкой из макета,
                     скидку по коду считает сервер при создании заказа. -->
                <div class="steam__promo-field" id="steam-promo" data-steam-promo-field hidden>
                  <input
                    class="steam__promo-input"
                    type="text"
                    placeholder="Промокод"
                    aria-label="Промокод"
                    autocomplete="off"
                    spellcheck="false"
                    data-steam-promo-input
                  />
                  <p class="steam__promo-error" data-steam-promo-error hidden></p>
                </div>
              </div>
            </div>

            <label class="steam__login">
              <span class="steam__login-field">
                <span data-icon="login-profile"></span>
                <input type="text" placeholder="Логин Steam" aria-label="Логин Steam" />
              </span>
              <button class="steam__hint" type="button" aria-label="Где найти логин">i</button>
            </label>

            <div class="steam__amount">
              <span class="steam__amount-label">
                <span data-icon="ruble"></span>
                <span class="steam__amount-text">
                  <span class="steam__amount-caption">Сумма</span>
                  <span class="steam__amount-value">500₽</span>
                </span>
              </span>

              <!-- Рассинхрон валют (сумма в ₽, кнопка в $) взят из макета: ТЗ просит его не исправлять. -->
              <div class="currency" data-currency-switcher role="group" aria-label="Валюта">
                <button class="currency__button" type="button" data-currency="USD" aria-pressed="true">$</button>
                <button class="currency__button" type="button" data-currency="KZT" aria-pressed="false">₸</button>
                <button class="currency__button" type="button" data-currency="RUB" aria-pressed="false">₽</button>
              </div>
            </div>

            <button class="steam__pay" type="button" data-steam-pay>Оплатить 500$</button>
          </div>
        </section>

        <section class="section" aria-label="Популярные товары">
          <div class="section__head">
            <h2 class="section__title">Популярные товары</h2>
            <div class="section__tabs" data-tabs></div>
          </div>
          <div class="cards" data-cards="popular"></div>
        </section>

        <section class="section" aria-label="Рекомендованные товары">
          <div class="section__head">
            <h2 class="section__title">Рекомендованные товары</h2>
            <button class="section__action" type="button">Показать все</button>
          </div>
          <div class="cards" data-cards="recommended"></div>
        </section>

        <section class="section" aria-label="Другие товары">
          <div class="section__head">
            <h2 class="section__title">Другие товары</h2>
            <button class="section__action" type="button">Показать все</button>
          </div>
          <div class="cards" data-cards="other"></div>
        </section>

        <section aria-label="Последние отзывы">
          <div class="reviews-head">
            <div class="reviews-head__text">
              <h2 class="reviews-head__title">Последние отзывы</h2>
              <p class="reviews-head__subtitle">Все отзывы взяты с независимой площадки</p>
            </div>
            <button class="section__action" type="button">Показать все</button>
          </div>
          <div class="reviews" data-reviews></div>
        </section>

        <footer class="footer" data-footer></footer>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
