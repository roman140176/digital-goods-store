name: ggsel-test

x-php: &php
  build: ./docker/php
  restart: unless-stopped
  user: "${APP_UID:-1000}:${APP_GID:-1000}"
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: store
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d store"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5433:5432"

  app:
    <<: *php
    volumes:
      - ./backend:/var/www
      - ./scripts:/scripts:ro
    env_file: ./backend/.env

  worker:
    <<: *php
    volumes:
      - ./backend:/var/www
    env_file: ./backend/.env
    command: php artisan queue:work --tries=5 --backoff=2 --timeout=90 --sleep=1
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

  scheduler:
    <<: *php
    volumes:
      - ./backend:/var/www
    env_file: ./backend/.env
    command: php artisan schedule:work
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      # Монтируется родительский каталог: сборщик пересоздаёт dist,
      # и монтирование самого dist указывало бы на удалённый каталог.
      - ./frontend:/srv/frontend:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # Два независимых поставщика: один образ, разные склады и профили отказов.
  # PHP_CLI_SERVER_WORKERS даёт встроенному серверу реальную многопроцессность,
  # иначе параллельные /issue выстроились бы в очередь.
  supplier-a:
    <<: *php
    volumes:
      - ./supplier:/var/www
    environment:
      SUPPLIER_ID: a
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: supplier_a
      PGUSER: app
      PGPASSWORD: secret
      KEYS_OFFSET: 0
      KEYS_LIMIT: 30
      ERROR_RATE: 0
      TIMEOUT_RATE: 0
      ISSUE_THEN_TIMEOUT: 0
      TIMEOUT_SECONDS: 10
      PHP_CLI_SERVER_WORKERS: 8
    ports:
      - "8086:80"
    command: php -S 0.0.0.0:80 -t /var/www/public

  supplier-b:
    <<: *php
    volumes:
      - ./supplier:/var/www
    environment:
      SUPPLIER_ID: b
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: supplier_b
      PGUSER: app
      PGPASSWORD: secret
      KEYS_OFFSET: 30
      KEYS_LIMIT: 20
      ERROR_RATE: 0
      TIMEOUT_RATE: 0
      ISSUE_THEN_TIMEOUT: 0
      TIMEOUT_SECONDS: 10
      PHP_CLI_SERVER_WORKERS: 8
    ports:
      - "8087:80"
    command: php -S 0.0.0.0:80 -t /var/www/public

volumes:
  pgdata:
