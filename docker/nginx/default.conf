server {
    listen 80;
    server_name _;

    # Витрина: собранный фронт
    root /srv/frontend/dist;
    index index.html;

    client_max_body_size 4m;

    location / {
        try_files $uri $uri/ =404;
    }

    # Живой поток витрины (SSE). Location точного совпадения объявлен ВЫШЕ
    # регулярки ^/(api|admin) и по правилам nginx проверяется раньше любых
    # регулярных выражений — иначе поток ушёл бы в php-fpm и занял воркера
    # на всё время соединения.
    location = /api/stream {
        # Адрес апстрима подставляется переменной, а не литералом, и это не
        # украшательство: с литеральным именем nginx резолвит его ОДИН раз
        # при загрузке конфига и держит адрес до перезапуска. Пересоздание
        # контейнера стримера (docker compose up -d --build streamer выдаёт
        # ему новый адрес) отдавало бы после этого 502 до перезапуска самого
        # nginx, а если контейнера ещё нет — nginx просто не стартовал бы
        # («host not found in upstream»), унося с собой всю витрину.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $streamer streamer:8090;
        proxy_pass http://$streamer;

        proxy_http_version 1.1;
        # Пустой Connection вместо унаследованного «close»: соединение к
        # апстриму должно жить, пока живёт поток.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Буферизация и кэш выключены: событие обязано уйти клиенту сразу,
        # а не когда наберётся буфер прокси.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Поток молчит между событиями, и обычный таймаут чтения обрывал бы
        # его на ровном месте. Час с запасом перекрывает пульс раз в 15 с,
        # которым стример подтверждает, что соединение живо.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API, эмулятор оплаты и админка уходят в php-fpm (Laravel)
    location ~ ^/(api|admin)(/|$) {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/public;
        fastcgi_read_timeout 60s;
    }
}
